name: Upgrade new puzzle assets to 1024

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/upgrade-new-puzzles-1024.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Resize five puzzle pairs and refresh manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          import re

          puzzle_ids = [
              'home-office',
              'farmers-market',
              'bathroom-vanity',
              'lakeside-picnic',
              'laundry-room',
          ]
          imports = Path('UI/src/imports')
          manifest_path = Path('packages/shared/src/puzzle-asset-manifest.ts')
          hashes = {}

          for puzzle_id in puzzle_ids:
              for variant in ('original', 'modified'):
                  filename = f'{puzzle_id}-{variant}.webp'
                  path = imports / filename
                  with Image.open(path) as image:
                      image = image.convert('RGB')
                      if image.size != (1024, 1024):
                          image = image.resize((1024, 1024), Image.Resampling.LANCZOS)
                      image.save(path, 'WEBP', quality=82, method=6)
                  with Image.open(path) as check:
                      if check.size != (1024, 1024):
                          raise RuntimeError(f'{filename} stayed at {check.size}')
                  hashes[filename] = hashlib.sha256(path.read_bytes()).hexdigest().upper()

          text = manifest_path.read_text()
          text = text.replace('  width: number;\n  height: number;', '  width: 1024;\n  height: 1024;')
          text = text.replace(
              'const webp = (fileName: string, sha256: string, width = 1024, height = 1024): PuzzleAssetFileMetadata => ({\n'
              '  fileName,\n  sha256,\n  mimeType: "image/webp",\n  width,\n  height,\n});',
              'const webp = (fileName: string, sha256: string): PuzzleAssetFileMetadata => ({\n'
              '  fileName,\n  sha256,\n  mimeType: "image/webp",\n  width: 1024,\n  height: 1024,\n});'
          )

          for puzzle_id in puzzle_ids:
              text = re.sub(
                  rf'("{re.escape(puzzle_id)}": \{{\n\s+version: ")[^"]+("),',
                  rf'\g<1>2026-08-28.2\g<2>,',
                  text,
                  count=1,
              )
              for variant in ('original', 'modified'):
                  filename = f'{puzzle_id}-{variant}.webp'
                  digest = hashes[filename]
                  pattern = rf'({variant}: webp\("{re.escape(filename)}", ")[A-F0-9]+("(?:,\s*\d+,\s*\d+)?\),)'
                  replacement = rf'\g<1>{digest}"),'
                  text, count = re.subn(pattern, replacement, text, count=1)
                  if count != 1:
                      raise RuntimeError(f'Could not update manifest entry for {filename}')

          manifest_path.write_text(text)
          PY

      - name: Verify manifest hashes and dimensions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          import re

          text = Path('packages/shared/src/puzzle-asset-manifest.ts').read_text()
          ids = ['home-office','farmers-market','bathroom-vanity','lakeside-picnic','laundry-room']
          for puzzle_id in ids:
              for variant in ('original','modified'):
                  filename = f'{puzzle_id}-{variant}.webp'
                  path = Path('UI/src/imports') / filename
                  with Image.open(path) as image:
                      assert image.size == (1024, 1024), (filename, image.size)
                  digest = hashlib.sha256(path.read_bytes()).hexdigest().upper()
                  assert f'webp("{filename}", "{digest}")' in text, filename
          print('Verified 10 assets at 1024x1024 with matching SHA-256 metadata.')
          PY

      - name: Commit upgraded assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UI/src/imports/home-office-*.webp \
                  UI/src/imports/farmers-market-*.webp \
                  UI/src/imports/bathroom-vanity-*.webp \
                  UI/src/imports/lakeside-picnic-*.webp \
                  UI/src/imports/laundry-room-*.webp \
                  packages/shared/src/puzzle-asset-manifest.ts
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Upgrade new puzzle assets to 1024x1024"
          git push origin HEAD:main
