services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spot_difference_battle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spot-battle-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data-v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spot_difference_battle"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data-v2:
