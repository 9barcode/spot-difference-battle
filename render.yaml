services:
  - type: web
    name: spot-difference-battle-staging
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spot-difference-battle-staging-db
          property: connectionString

databases:
  - name: spot-difference-battle-staging-db
    plan: free
    region: singapore
    databaseName: spot_difference_battle
    user: spot_battle
